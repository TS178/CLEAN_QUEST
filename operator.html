<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>運営用 集計 — ビーチクリーン探検隊</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fbfaf6">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/collection.css">
  <link rel="stylesheet" href="css/collection-painted.css">
  <style>
    .op { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .op h1 { font-size: 20px; margin: 4px 0 12px; }
    .op .grid { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 14px; align-items: start; }
    @media (max-width: 800px) { .op .grid { grid-template-columns: 1fr; } }
    .cam { position: relative; background: #000; border-radius: 16px; overflow: hidden; aspect-ratio: 1; }
    .cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cam .frame { position: absolute; inset: 18%; border: 4px solid rgba(255, 255, 255, 0.85); border-radius: 18px; pointer-events: none; }
    .cam .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; text-align: center; padding: 16px; line-height: 1.6; }
    .flashok { animation: okflash 0.9s ease-out; }
    @keyframes okflash { 0% { box-shadow: 0 0 0 8px var(--mint-deep); } 100% { box-shadow: 0 0 0 0 transparent; } }
    .last { padding: 10px 12px; border-radius: 12px; background: var(--cream); font-weight: 700; margin-top: 10px; min-height: 44px; }
    .last.ok { background: var(--mint); }
    .last.ng { background: var(--peach); }
    .sum { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
    .tbl-wrap { overflow-x: auto; }
    table.res { border-collapse: collapse; width: 100%; font-size: 13px; background: #fff; }
    table.res th, table.res td { border-bottom: 1px solid var(--line); padding: 7px 6px; text-align: left; white-space: nowrap; }
    table.res th { background: #f3f8fc; position: sticky; top: 0; }
    table.res td.num { text-align: right; }
    .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
    .tools select { padding: 8px 10px; border-radius: 10px; border: 2px solid var(--line); }
    textarea { width: 100%; min-height: 70px; border-radius: 12px; border: 2px solid var(--line); padding: 8px; font-size: 12px; }
    .del { border: none; background: none; color: #c0392b; font-size: 12px; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="op">
    <h1>🧑‍✈️ 運営用 集計画面 <small class="note">ビーチクリーン探検隊</small></h1>
    <div class="grid">
      <div>
        <div class="card">
          <h3>① 参加者の「イベント終了QR」を読み取る</h3>
          <div class="cam" id="cam">
            <video id="video" playsinline muted></video>
            <div class="frame"></div>
            <div class="msg" id="camMsg">「カメラを起動」を押してください</div>
          </div>
          <div class="btn-row" style="margin-top:10px">
            <button class="btn mint" id="camStart">📷 カメラ起動</button>
            <button class="btn ghost" id="camStop">停止</button>
          </div>
          <div class="last" id="last">読み取った結果がここに出ます</div>
          <p class="note">同じ端末のQRをもう一度読むと、新しい内容で上書きされます（二重に数えません）。<br>
            読み取りエンジン: <span id="engine">—</span></p>
          <details>
            <summary class="note">カメラが使えないとき（QRの文字を貼り付けて追加）</summary>
            <textarea id="manual" placeholder='{"v":2,"app":"bct",...}'></textarea>
            <button class="btn small" id="manualAdd">追加する</button>
          </details>
        </div>
      </div>
      <div>
        <div class="card">
          <h3>② 集計</h3>
          <div class="sum" id="sum"></div>
        </div>
        <div class="card">
          <div class="tools">
            <label>並び替え：
              <select id="sort">
                <option value="at">読み取った順</option>
                <option value="name">隊の名前順</option>
              </select></label>
            <button class="btn small" id="csv">CSV を書き出す</button>
            <button class="btn small ghost" id="clear">全部消す</button>
          </div>
          <div class="tbl-wrap"><table class="res" id="tbl"></table></div>
        </div>
        <div class="card">
          <h3>種類別のゴミの数（全隊の合計）</h3>
          <div class="bars" id="bars"></div>
        </div>
        <div class="card">
          <h3>称号ごとの獲得隊数</h3>
          <div class="bars" id="bdBars"></div>
        </div>
      </div>
    </div>
    <p class="note">データはこの端末（運営用の端末）の中だけに保存されます。外部には送信しません。<br>
      清掃の量や成績で順位をつけない方針のため、一覧に順位は表示していません（危険なごみを無理に拾うことにつながらないように）。</p>
  </div>

  <script src="vendor/jsqr/jsQR.js"></script>
  <script src="js/trash.js"></script>
  <script src="js/pets.js"></script>
  <script src="js/badges.js"></script>
  <script src="js/collection-sprites.js"></script>
  <script src="js/collection-art.js"></script>
  <script src="js/operator.js"></script>
</body>
</html>

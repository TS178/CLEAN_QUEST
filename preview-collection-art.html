<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>称号と分別アイテム</title><link rel="icon" href="icons/icon.svg"><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/collection.css"><link rel="stylesheet" href="css/beach.css"><link rel="stylesheet" href="css/collection-painted.css"><style>body{overflow:auto}.art-preview{max-width:900px;margin:auto;padding:30px 18px}.art-preview>h1{font-size:26px;text-align:center}.art-preview>p{text-align:center}.art-preview .badges{grid-template-columns:repeat(4,minmax(0,1fr))}.art-preview .bins{margin-top:22px}.litter-row{display:flex;justify-content:center;flex-wrap:wrap;gap:20px;margin:22px 0}.litter-row figure{text-align:center;margin:0;font-size:12px}.litter-row svg{display:block;width:74px;height:74px;margin:auto}.art-preview .medal{pointer-events:none}@media(max-width:600px){.art-preview .badges{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><main class="art-preview"><h1>うみの たからものバッジ</h1><p>実装した称号と、ごみ箱・ごみの一覧です。</p><div class="badges" id="badges"></div><h2>たんけんたいの おそうじ道具</h2><div class="bins" id="bins"></div><div class="litter-row" id="litter"></div><h2 id="mission-icons">そうじミッション</h2><div class="litter-row" id="missions"></div><p><a href="index.html">アプリを開く</a> ・ <a href="preview-pet-rear-parts.html">背面パーツを見る</a></p></main><script src="js/trash.js"></script><script src="js/collection-sprites.js"></script><script src="js/mission-sprites.js"></script><script src="js/collection-art.js"></script><script src="js/badges.js"></script><script>
document.getElementById('badges').innerHTML=BCT.BADGES.map(b=>`<div class="badge"><div class="medal painted-medal">${BCT.collectionArt.badge(b.id)}</div><span class="badge-name">${b.name}</span></div>`).join('')+`<div class="badge locked"><div class="medal painted-medal">${BCT.collectionArt.badge('first')}</div><span class="badge-name">まだ とっていないとき</span><span class="badge-state">これから</span></div>`;
document.getElementById('bins').innerHTML=BCT.BINS.map(b=>`<div class="bin">${BCT.collectionArt.bin(b.key)}<span>${b.name}</span></div>`).join('');
document.getElementById('litter').innerHTML=BCT.BEACH_TRASH.map(t=>`<figure>${BCT.collectionArt.trash(t.key)}<figcaption>${t.name}<br><small>${BCT.binOf(t.bin).name}</small></figcaption></figure>`).join('');
document.getElementById('missions').innerHTML=BCT.CLEAN_MISSIONS.map(t=>`<figure>${BCT.collectionArt.missionIcon(t.key)}<figcaption>${t.name}</figcaption></figure>`).join('');
</script></body></html>

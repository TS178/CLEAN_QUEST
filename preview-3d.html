<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>海のともだち — 立体デザイン確認</title>
  <style>
    :root{font-family:'Meiryo',sans-serif;color:#244f58;background:#f8f7f2;color-scheme:light}
    *{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #3299a6;outline-offset:3px}
    .page{max-width:1320px;margin:auto;padding:28px 32px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}
    .eyebrow{font:700 10px system-ui;letter-spacing:.2em;color:#9b7c44;margin:0 0 8px}h1{font-size:25px;font-weight:700;letter-spacing:.02em;margin:0}.tag{border:1px solid #d9d6c7;border-radius:30px;padding:9px 15px;font-size:12px;color:#76857b;background:#fffdf8}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px}.viewer{border-radius:30px;border:1px solid #dce6df;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#fffefa 0%,#edf6f0 70%,#e3f0e8 100%);position:relative;min-height:640px}
    #scene{height:640px;width:100%;touch-action:none;cursor:grab}#scene:active{cursor:grabbing}#scene canvas{display:block;width:100%;height:100%}.viewer-head{position:absolute;top:24px;left:26px;right:26px;display:flex;justify-content:space-between;pointer-events:none}.viewer-head strong{font-size:17px}.sub{font-size:11px;color:#6c9288;display:block;margin-top:5px}.hint{position:absolute;left:0;right:0;bottom:80px;text-align:center;font-size:12px;color:#78958e;pointer-events:none}.view-controls{position:absolute;bottom:22px;left:20px;right:20px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
    .view-controls button{border:1px solid #d0dfd5;background:#ffffffdf;border-radius:30px;padding:10px 15px;color:#3f6965;font-size:12px}.view-controls button[aria-pressed=true]{background:#2c726b;color:white;border-color:#2c726b}
    aside{display:flex;flex-direction:column;gap:14px}.panel{background:#fffefa;border:1px solid #e4e1d5;border-radius:20px;padding:19px}.panel h2{font-size:12px;color:#8b7a5b;margin:0 0 12px}.choices{display:flex;gap:7px;flex-wrap:wrap}.choices button{flex:1;border:1px solid #dcded3;background:#f9faf6;color:#59716b;border-radius:12px;min-height:40px;padding:8px;font-size:12px;white-space:nowrap}.choices button[aria-pressed=true]{background:#e1f1e8;color:#216c5e;border-color:#7aac99;font-weight:bold}.legend{font-size:12px;color:#728279;line-height:1.9;margin:12px 0 0}.note{font-size:12px;color:#79827b;line-height:1.8;margin:20px 2px 0}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}.wave{background:#eadcb4}.star{background:#efc96b}.shine{background:#dfabd8}#error{padding:30px;color:#9a3c35}#error[hidden]{display:none}
    @media(max-width:800px){.page{padding:18px 16px}.top{align-items:flex-start}.tag{font-size:10px;padding:8px}h1{font-size:20px}.layout{grid-template-columns:1fr}.viewer{min-height:480px}#scene{height:480px}aside{display:grid;grid-template-columns:1fr 1fr;gap:10px}.panel{padding:14px}.panel:last-child{grid-column:1/-1}.note{margin-top:14px}}
    @media(max-width:400px){aside{grid-template-columns:1fr}.panel:last-child{grid-column:auto}.tag{display:none}.viewer-head{left:18px;right:18px}.view-controls button{padding:9px 12px}.choices button{font-size:11px}}
  </style>
</head>
<body>
  <div class="page">
    <header class="top"><div><p class="eyebrow">BEACH CLEAN EXPLORERS / DESIGN STUDY</p><h1>海のともだちを、立体に。</h1></div><span class="tag">デザイン確認用・本体は未変更</span></header>
    <div class="layout">
      <section class="viewer" aria-label="キャラクターの立体プレビュー">
        <div class="viewer-head"><div><strong id="petName">イルカ</strong><span class="sub" id="stageName">こどものすがた</span></div><span class="sub">360° VIEW</span></div>
        <div id="scene" aria-label="ドラッグするとキャラクターが回転します"></div>
        <p id="error" hidden></p>
        <div class="hint">ドラッグして、横や後ろから見られます</div>
        <div class="view-controls"><button id="front">正面へ</button><button id="back">背中を見る</button><button id="turn" aria-pressed="false">折り返しを見る</button><button id="smile" aria-pressed="false">えがお</button></div>
      </section>
      <aside>
        <section class="panel"><h2>ともだち</h2><div class="choices" data-option="type"><button data-value="dolphin" aria-pressed="true">イルカ</button><button data-value="turtle" aria-pressed="false">ウミガメ</button><button data-value="hermit" aria-pressed="false">ヤドカリ</button></div></section>
        <section class="panel"><h2>せいちょう</h2><div class="choices" data-option="stage"><button data-value="1" aria-pressed="true">1 こども</button><button data-value="2" aria-pressed="false">2 とちゅう</button><button data-value="3" aria-pressed="false">3 りっぱ</button></div></section>
        <section class="panel"><h2>あたま</h2><div class="choices" data-option="head"><button data-value="none" aria-pressed="false">なし</button><button data-value="cap" aria-pressed="true">マリンキャップ</button></div><p class="legend">頭を包む丸みと、顔に沿うつば。</p></section>
        <section class="panel"><h2>くびもと</h2><div class="choices" data-option="acc"><button data-value="none" aria-pressed="false">なし</button><button data-value="scarf" aria-pressed="true">スカーフ</button><button data-value="pendant" aria-pressed="false">ペンダント</button></div><p class="legend">後ろまで回る布とひも。向きを変えても体に沿います。</p></section>
        <section class="panel"><h2>みため</h2><div class="choices" data-option="look"><button data-value="none" aria-pressed="true">なし</button><button data-value="wave" aria-pressed="false"><i class="dot wave"></i>なみ</button><button data-value="star" aria-pressed="false"><i class="dot star"></i>ほし</button><button data-value="sparkle" aria-pressed="false"><i class="dot shine"></i>きらめき</button></div><p class="legend">なみはアイボリー、ほしは金色、きらめきは淡いピンク。体の青と見分けやすい配色です。</p></section>
      </aside>
    </div>
    <p class="note">これは動き・装着感・配色を確認するための立体モデル案です。アプリのキャラクターや保存データは変更していません。</p>
  </div>
  <script type="module" src="js/pet-viewer-preview.js"></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ようせいの動き・付け根の修正確認</title>
<link rel="stylesheet" href="css/pet-rig.css">
<style>
body{margin:0;background:#f0f8f5;color:#29493f;font:16px/1.7 system-ui,sans-serif}
header{padding:20px;position:sticky;top:0;background:#fffcf2f5;z-index:10;border-bottom:1px solid #cddfd6}
h1{font-size:22px;margin:0}p{margin:5px 0 12px}label{display:inline-flex;gap:8px;align-items:center;margin-right:24px}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;padding:20px;max-width:1150px;margin:auto}
article{background:white;border:1px solid #d9e8e1;border-radius:22px;padding:16px}h2{font-size:17px;margin:0}
.host{position:relative;aspect-ratio:1;max-width:330px;margin:auto;overflow:hidden}.host.left{transform:scaleX(-1)}
.rig-front{position:absolute;inset:0}.rig-front svg{width:100%;height:100%}.note{font-size:13px;color:#59776c}
</style>
<header><h1>ようせいの動き・付け根の修正確認</h1>
<p>王冠の傾き、顔の後ろに回る首飾りの紐、ヒレ・脚の動きをご確認ください。</p>
<label><input id="original" type="checkbox">元の静止画と比較</label>
<label><input id="left" type="checkbox">左向き</label>
<label>動きの速さ<input id="speed" type="range" min="0" max="1.3" step=".1" value="1"></label>
<label>装備<select id="equipment"><option value="crown">王冠とペンダント</option><option value="pendant">ペンダントと花飾り</option><option value="hat">帽子とスカーフ</option><option value="pouch">ポシェットと花飾り</option><option value="none">装備なし</option></select></label>
<div class="note">確認用ページです。育成・購入データは変更しません。端末の「動きを減らす」が有効な場合は静止画になります。</div></header>
<p id="renderStatus" role="status" style="padding:0 20px">描画方式を確認しています…</p>
<main id="cards"></main>
<script src="js/config.js"></script><script src="js/items.js"></script><script src="js/pets.js"></script>
<script src="js/pet-sprites.js"></script><script src="js/pet-art.js"></script><script src="js/pet-art-fix.js"></script>
<script src="js/pet-rig-config.js"></script><script src="js/pet-rig-cut.js"></script><script src="js/pet-rig.js"></script><script src="js/pet-skin.js"></script>
<script>
(async()=>{
  const rigs=[],names={dolphin:'イルカ',turtle:'ウミガメ',hermit:'ヤドカリ'};
  const update=()=>rigs.forEach(r=>{r.host.classList.toggle('left',document.querySelector('#left').checked);BCT.petRig.setManualSpeed(r,+document.querySelector('#speed').value);BCT.petRig.setActive(r,!document.querySelector('#original').checked);});
  async function rebuild(){
    document.querySelector('#equipment').disabled=true;
    rigs.splice(0).forEach(r=>BCT.petRig.destroy(r));document.querySelector('#cards').replaceChildren();
    const equip={crown:{head:'head_crown',acc:'accessory_pendant'},pendant:{head:'head_flower',acc:'accessory_pendant'},hat:{head:'head_marine',acc:'accessory_scarf'},pouch:{head:'head_flower',acc:'accessory_korogaki'},none:{}}[document.querySelector('#equipment').value];
    for(const type of Object.keys(names))for(const stage of [1,2,3]){
      const card=document.createElement('article');card.innerHTML=`<h2>${names[type]}・第${stage}形態</h2><div class="host"><div class="rig-front">${BCT.art.render({type,stage,equip,motion:false})}</div></div>`;
      document.querySelector('#cards').append(card);const host=card.querySelector('.host'),r=BCT.petRig.create({type,stage,equip,host});await r.ready;rigs.push(r);update();
    }
  const connected=rigs.filter(r=>r.parts?.skin).length,active=rigs.filter(r=>r.parts?.skin&&!r.parts.skin.canvas.hidden).length;
  document.querySelector('#renderStatus').textContent=connected===9?`連続描画 1.26：${active}/9形態で有効${active<9?'（一部は端末の描画制限により静止画）':''}`:'旧版の描画が読み込まれています。アプリを1.26へ更新するか、キャッシュを分離した確認ページを開いてください。';
    document.querySelector('#equipment').disabled=false;
  }
  await rebuild();document.querySelector('#equipment').onchange=rebuild;
  document.querySelectorAll('input').forEach(e=>e.addEventListener('input',update));
  window.addEventListener('pagehide',()=>rigs.forEach(r=>BCT.petRig.destroy(r)));
})();
</script>
</html>

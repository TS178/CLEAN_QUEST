<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>原画のまま、ふわり。｜キャラクター表示</title>
  <link rel="stylesheet" href="css/pet-texture-demo.css">
</head>
<body>
  <main class="texture-page">
    <header class="page-head">
      <div><p class="eyebrow">BEACH CLEAN EXPLORERS</p><h1>原画のまま、ふわり。</h1><p class="intro">絵の色も、かたちも。そのままに動かすプレビュー。</p></div>
      <span class="badge">イラスト × Three.js</span>
    </header>
    <div class="demo-layout">
      <section class="stage-panel" aria-label="キャラクターのプレビュー">
        <div class="stage-heading"><div><h2 id="pet-name">イルカ</h2><span id="stage-name">こどものすがた</span></div><span id="view-name">正面の原画</span></div>
        <div id="pet-scene" aria-label="左右にドラッグして向きを変えるプレビュー"></div>
        <div id="load-status" class="load-status" role="status">イラストを読み込んでいます…</div>
        <div id="scene-error" class="scene-error" role="alert" hidden><p></p><button id="retry">もう一度開く</button></div>
        <div class="stage-footer"><p>左右にドラッグで回転 · タップでふわり</p><button id="lift" class="lift-button">ふわっと浮かす <span aria-hidden="true">↗</span></button></div>
      </section>
      <aside class="settings" aria-label="表示の設定">
        <section class="setting-section"><h2>ともだち</h2><div class="species-choices" data-choice="type">
          <button data-value="dolphin" aria-pressed="true"><img src="assets/pets/dolphin-1-normal.webp" alt="">イルカ</button>
          <button data-value="turtle" aria-pressed="false"><img src="assets/pets/turtle-1-normal.webp" alt="">ウミガメ</button>
          <button data-value="hermit" aria-pressed="false"><img src="assets/pets/hermit-1-normal.webp" alt="">ヤドカリ</button>
        </div></section>
        <section class="setting-section"><h2>せいちょう</h2><div class="choice-row" data-choice="stage"><button data-value="1" aria-pressed="true">こども</button><button data-value="2" aria-pressed="false">とちゅう</button><button data-value="3" aria-pressed="false">りっぱ</button></div></section>
        <section class="setting-section"><div class="label-row"><h2>むき</h2><output id="angle-value" for="angle">0°</output></div><div class="choice-row" id="view-choices"><button data-angle="0" aria-pressed="true">正面</button><button data-angle="90" aria-pressed="false">側面</button><button data-angle="180" aria-pressed="false">背面</button></div><input id="angle" aria-label="向き。0度が正面、90度が側面、180度が背面" type="range" min="0" max="180" value="0" step="1"><div class="range-labels"><span>正面</span><span>側面</span><span>背面</span></div></section>
        <section class="setting-section"><h2>うごき</h2><label class="toggle-row"><span>ゆっくり浮遊</span><input type="checkbox" id="floating" checked></label><label class="toggle-row"><span>自動で回転</span><input type="checkbox" id="rotate"></label><label class="label-row speed-label" for="speed"><span>回転の速さ</span><output id="speed-value" for="speed">1.0×</output></label><input id="speed" type="range" min="0.3" max="1.8" step="0.1" value="1"></section>
        <button id="reset" class="reset-button">最初の表示にもどす</button>
      </aside>
    </div>
    <p class="footnote">正面の原画と、生成した側面・背面を使用した2.5D表示です。向きに応じて画像を切り替え、正面から背面まで往復します。ゲーム本体・保存データは変更しません。</p>
  </main>
  <script type="module" src="js/pet-texture-demo.js"></script>
</body>
</html>

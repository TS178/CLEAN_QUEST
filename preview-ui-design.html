<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>探検隊の新しいアイコン</title><link rel="icon" href="icons/icon.svg"><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/collection.css"><link rel="stylesheet" href="css/ui-design.css"><style>
body{overflow:auto;background:#fbfaf6}.ui-preview{max-width:820px;margin:auto;padding:28px 20px 50px}.ui-preview h1{font-size:24px}.ui-preview h2{font-size:18px;margin-top:28px}.ui-preview p{font-size:13px;color:#697669}.ui-preview .medal-wallet{max-width:440px;margin:20px auto}.icon-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.icon-grid figure{margin:0;background:#fffef9;border:1px solid #e7e1d0;border-radius:18px;padding:16px 6px;text-align:center}.icon-grid .expedition-icon{display:block;width:58px;height:58px;margin:0 auto 10px}.icon-grid figcaption{font-size:11px;font-weight:700}.beach-preview{width:100%;border-radius:26px;display:block}.ui-preview a{color:#266950}@media(max-width:550px){.icon-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.icon-grid .expedition-icon{width:50px;height:50px}}
</style></head><body><main class="ui-preview"><h1>探検隊の あたらしいデザイン</h1><p>文字のない海辺と、きれいになった砂浜のメダル。</p><div id="wallet"></div><h2>５つのタブ</h2><div class="icon-grid" id="navIcons"></div><h2>ミッション・きせかえ・海辺のようす</h2><div class="icon-grid" id="sectionIcons"></div><h2>ショップのジャンル</h2><div class="icon-grid" id="categoryIcons"></div><h2>ホームの海辺</h2><img class="beach-preview" src="assets/ui/beach.webp" alt="明るい空と透明な海、きれいな砂浜"><p><a href="index.html">アプリで確認する</a></p></main>
<script src="js/config.js"></script><script src="js/items.js"></script><script src="js/pets.js"></script><script src="js/pet-sprites.js"></script><script src="js/pet-art.js"></script><script src="js/home-art.js"></script><script src="js/habitat-sprites.js"></script><script src="js/habitat-painted-art.js"></script><script src="js/ui-design.js"></script><script>
const show=(id,items)=>document.getElementById(id).innerHTML=items.map(([key,label])=>`<figure>${BCT.art.icon(key)}<figcaption>${label}</figcaption></figure>`).join('');
show('navIcons',[['nav-home','ホーム'],['mission','ミッション'],['capture','ひろう'],['shop','ショップ'],['me','じぶん']]);
show('sectionIcons',[['quiz','うみクイズ'],['clean','そうじミッション'],['gift','とくべつなごほうび'],['found','みつけたゴミ'],['dress','きせかえ'],['sparkling','ピカピカ'],['dirty','よごれている']]);
show('categoryIcons',BCT.SLOTS.map(c=>[c.key,c.name]));
document.getElementById('wallet').innerHTML=BCT.medal.wallet(1240);
</script></body></html>
